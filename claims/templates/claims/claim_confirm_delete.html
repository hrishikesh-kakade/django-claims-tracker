<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirm Delete</title>
</head>
<body>

    <h1>Delete Claim</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ claim.case_id }}</strong>?
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit">Yes, Delete Claim</button>
    </form>

    <p>
        <a href="{% url 'claim_details' claim.id %}">
            Cancel
        </a>
    </p>

</body>
</html>
